<style>
/* Charte SDIS 88 : rouge, bleu clair, bleu foncé et vert de l'écusson ; typographie Aileron */
:root{
  --rouge:#E83828; --bleu:#7FB8E5; --marine:#2E2F8D; --vert:#59BB5C;
  --bg:#f2f4fa; --surface:#ffffff; --surface-2:#f5f6fb; --ink:#17183a; --muted:#585b78; --line:#d9dcea;
  --accent:var(--marine); --on-accent:#fff;
  --ok:#2f8a34; --ok-bg:#e3f3e4; --ko:#c8281a; --ko-bg:#fde6e3; --wait:#8a5a00; --wait-bg:#fdf0d6;
  --display:"Aileron","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:"Aileron","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0f22; --surface:#17183a; --surface-2:#1d1f46; --ink:#e8e9f6; --muted:#a3a6c6; --line:#2e3060;
  --accent:var(--bleu); --on-accent:#10112a;
  --ok:#7fd283; --ok-bg:#16301b; --ko:#ff8a7c; --ko-bg:#3d1714; --wait:#f3c265; --wait-bg:#33270e; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e0f22; --surface:#17183a; --surface-2:#1d1f46; --ink:#e8e9f6; --muted:#a3a6c6; --line:#2e3060;
  --accent:var(--bleu); --on-accent:#10112a;
  --ok:#7fd283; --ok-bg:#16301b; --ko:#ff8a7c; --ko-bg:#3d1714; --wait:#f3c265; --wait-bg:#33270e; color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;margin:0;min-height:100vh}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:18px 64px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:900;margin:0;text-wrap:balance;line-height:1.12;letter-spacing:-.005em}
h1{font-size:clamp(1.6rem,4.5vw,2.2rem)} h2{font-size:1.3rem} h3{font-size:1.1rem}
.eyebrow{font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.78rem;color:var(--rouge)}
.muted{color:var(--muted)} .small{font-size:.88rem} .mono{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--bleu);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .grow{flex:1;min-width:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;min-height:44px;display:inline-flex;align-items:center;gap:8px;justify-content:center;font-weight:700}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--muted);min-width:0}
input[type=range]{accent-color:var(--accent);width:100%}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:10px 14px;min-height:44px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.choice{display:flex;flex-direction:column;gap:6px}
/* bandeau */
.bar{background:var(--marine);color:#fff;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.bar-in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:60px}
.bar a.home{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.bar .wm{font-family:var(--display);font-weight:900;font-size:1.35rem;letter-spacing:.02em}
.bar .wm span{color:var(--bleu)}
.bar .sp{flex:1}
.bar .back{text-decoration:none;color:#fff;border-color:rgba(255,255,255,.35);background:transparent;min-height:40px}
.stripes{display:flex;height:5px}
.stripes i{flex:1}
.stripes i:nth-child(1){background:var(--rouge)} .stripes i:nth-child(2){background:var(--bleu)} .stripes i:nth-child(3){background:var(--vert)} .stripes i:nth-child(4){background:#fff}
/* accueil */
.hero{display:flex;flex-direction:column;gap:6px;padding:6px 0 2px}
.hero p{margin:0;max-width:62ch;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{text-decoration:none;display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;text-decoration:none;color:inherit}
.card:hover{border-color:var(--muted)}
.card .vis{height:96px;display:grid;place-items:center;color:#fff}
.card .vis svg{height:64px;width:auto}
.card.c1 .vis{background:var(--rouge)} .card.c2 .vis{background:var(--marine)} .card.c3 .vis{background:var(--vert)} .card.c4 .vis{background:var(--bleu);color:var(--marine)}
.card .tx{padding:4px 16px 16px;display:flex;flex-direction:column;gap:4px}
.card b{font-family:var(--display);font-weight:900;font-size:1.2rem}
.card .tx span{color:var(--muted);font-size:.92rem}
.install{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1.5px solid var(--bleu);border-radius:var(--r);padding:12px 14px}
.install .grow{flex:1;min-width:200px}
.install svg{flex:none;border-radius:10px}
.foot{font-size:.8rem;color:var(--muted);text-align:center;margin-top:8px}
/* nouveautés */
.nv{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.nv .panel{border-top:5px solid var(--rouge)}
.nv .panel:nth-child(2){border-top-color:var(--bleu)} .nv .panel:nth-child(3){border-top-color:var(--vert)}
.nv p{margin:0}
.tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.org{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.org > div{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2)}
.org b{font-family:var(--display);font-weight:900;font-size:1.25rem;display:block}
.org .i{border-left:5px solid var(--vert)} .org .e{border-left:5px solid var(--marine)} .org .a{border-left:5px solid var(--rouge)}
.fiches{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;max-width:calc(100% - 32px)}
.warn{background:var(--wait-bg);color:var(--wait);border-radius:8px;padding:10px 12px;font-size:.9rem}
/* défibrillation */
.df{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:14px;align-items:stretch}
@media (max-width:760px){.df{grid-template-columns:1fr}}
.df-screen{position:relative;background:#050a08;border-radius:16px;border:10px solid #2a302d;box-shadow:inset 0 0 0 1px #000;padding:10px 12px 12px;min-width:0;overflow:hidden;
  background-image:linear-gradient(rgba(57,255,136,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(57,255,136,.07) 1px,transparent 1px),linear-gradient(rgba(57,255,136,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(57,255,136,.03) 1px,transparent 1px);
  background-size:50px 50px,50px 50px,10px 10px,10px 10px;background-position:12px 10px}
.df-screen canvas{display:block;width:100%;height:clamp(260px,42vw,420px)}
.df-head{display:flex;align-items:baseline;gap:14px;color:#39ff88;font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:1rem}
.df-head .df-lab{flex:1;color:#39ff88;opacity:.85}
.df-hr{color:#39ff88;font-variant-numeric:tabular-nums}
.df-hr b{font-size:2.6rem;line-height:1}
.df-hr small{font-size:.8rem;opacity:.8}
.df-p{position:absolute;left:14px;top:72%;color:#4fd2ff;font-family:var(--display);font-weight:700;font-size:.85rem;letter-spacing:.06em;opacity:.85}
.df-msg{margin-top:8px;padding:8px 12px;min-height:2.6em;border-radius:8px;font-weight:700;font-size:.95rem;background:rgba(255,255,255,.1);color:#fff}
.df-msg.idle{color:rgba(255,255,255,.45);background:rgba(255,255,255,.05)}
.df-msg.warn{background:rgba(255,190,40,.18);color:#ffd36b}
.df-msg.alert{background:rgba(255,120,0,.25);color:#ffb15c}
.df-msg.ok{background:rgba(57,255,136,.16);color:#8dffbd}
.df-screen.flash::after{content:"";position:absolute;inset:0;background:#fff;animation:dfflash .45s ease-out forwards;pointer-events:none}
@keyframes dfflash{from{opacity:.95}to{opacity:0}}
.df-keys{display:flex;flex-direction:column;gap:10px;background:#2a302d;border-radius:16px;padding:12px}
@media (max-width:760px){.df-keys{display:grid;grid-template-columns:repeat(3,1fr)}.df-keys .dk{flex-direction:column;text-align:center;gap:4px;font-size:.85rem}.df-keys .dk.cpr{grid-column:span 2;flex-direction:row}}
.dk{display:flex;align-items:center;gap:10px;min-height:56px;border-radius:12px;border:0;background:#3a423e;color:#e8efeb;padding:8px 12px;font-weight:700;text-align:left;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.dk .ico{width:40px;flex:none;display:grid;place-items:center}
.dk .ico svg{width:38px;height:auto}
.dk[aria-pressed="true"]{background:#16a34a;color:#fff}
.dk.cpr[aria-pressed="true"]{background:#2563eb}
.dk:active{transform:translateY(1px)}
.dk.shock{flex-direction:column;justify-content:center;min-height:120px;background:#3a423e;gap:4px}
.dk.shock svg{width:76px;height:auto;opacity:.55;filter:grayscale(.4)}
.dk.shock.ready svg{opacity:1;filter:none;animation:shockblink .8s steps(2,end) infinite}
.dk.shock.ready{box-shadow:0 0 0 3px #ff8a00,inset 0 -3px 0 rgba(0,0,0,.35)}
@keyframes shockblink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.dk.shock.ready svg{animation:none}.df-screen.flash::after{animation-duration:.01s}}
.df-keys .btn.small{min-height:36px;padding:6px 10px;font-size:.85rem;background:transparent;color:#cfd8d3;border-color:#56605b}
@media (max-width:760px){.dk.shock{grid-column:span 3}}
#df-explain h3{margin:0}
#df-explain p{margin:0;max-width:75ch}

.fra-list{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
/* métronome RCP */
.rc-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.rc-grid{grid-template-columns:1fr}}
.rc-main{background:#0f1714;color:#eaf5ef;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center}
.rc-dial{width:min(78vw,300px);aspect-ratio:1;border-radius:50%;background:#0b120f;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:10px solid #22342c;position:relative}
.rc-dial.comp{border-color:#1d7a45}
.rc-dial.insuf{border-color:#2563eb}
.rc-dial.beat{animation:rcbeat var(--beat,.55s) ease-out}
@keyframes rcbeat{0%{box-shadow:0 0 0 0 rgba(76,194,122,.65);transform:scale(.965)}100%{box-shadow:0 0 0 26px rgba(76,194,122,0);transform:scale(1)}}
.rc-phase{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9fd9b5;font-size:1rem}
.rc-dial.insuf .rc-phase{color:#9cc0ff}
.rc-count{font-family:var(--display);font-weight:800;font-size:clamp(40px,11vw,72px);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;color:#fff}
.rc-cycle{font-size:.9rem;color:#a9b8b0}
.rc-row{display:flex;justify-content:space-between;gap:12px;width:100%;font-size:.9rem;color:#a9b8b0;flex-wrap:wrap}
.rc-row b{color:#fff}
.rc-go{width:100%;min-height:56px;font-size:1.1rem}
.rc-flash{width:100%;background:#7a4a00;color:#ffd99a;border-radius:10px;padding:10px 12px;font-weight:700;text-align:center}
.rc-tapzone{width:100%;min-height:160px;border-radius:16px;border:2px dashed #3d6b52;background:#15231d;color:#cfe9da;font-weight:700;font-size:1.1rem;touch-action:manipulation}
.rc-tapzone:active{background:#1d3a2c}
.rc-meter{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.rc-rate{font-family:var(--display);font-weight:800;font-size:clamp(56px,16vw,96px);line-height:1;font-variant-numeric:tabular-nums;color:var(--muted)}
.rc-rate.bon{color:var(--ok)} .rc-rate.lent,.rc-rate.rapide{color:var(--ko)}
.rc-unit{color:var(--muted);font-size:.9rem}
.rc-scale{position:relative;width:min(100%,460px);height:14px;border-radius:7px;display:flex;overflow:visible;margin-top:8px}
.rc-scale .z{height:100%}
.rc-scale .z.lent{flex:30;background:var(--ko-bg);border-radius:7px 0 0 7px}
.rc-scale .z.bon{flex:20;background:var(--ok)}
.rc-scale .z.rapide{flex:30;background:var(--ko-bg);border-radius:0 7px 7px 0}
.rc-scale i{position:absolute;top:-6px;width:4px;height:26px;margin-left:-2px;background:var(--ink);border-radius:2px;transition:left .25s ease-out;left:50%}
.rc-ticks{position:relative;width:min(100%,460px);height:16px;font-size:.75rem;color:var(--muted)}
.rc-ticks span{position:absolute;transform:translateX(-50%)}
.rc-ticks span:nth-child(1){left:0;transform:none}.rc-ticks span:nth-child(2){left:37.5%}.rc-ticks span:nth-child(3){left:62.5%}.rc-ticks span:nth-child(4){right:0;left:auto;transform:none}
.rc-verdict{font-weight:700;color:var(--muted)}
.rc-verdict.bon{color:var(--ok)} .rc-verdict.lent,.rc-verdict.rapide{color:var(--ko)}
@media (prefers-reduced-motion: reduce){.rc-dial.beat{animation:none}}

/* chrono arrêt cardiaque */
.ch-grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.ch-grid2{grid-template-columns:1fr}}
.ch-main{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ch-top{display:flex;justify-content:space-between;gap:12px;color:var(--muted)}
.ch-time{font-family:var(--display);font-weight:800;font-size:clamp(40px,8vw,64px);line-height:1;color:var(--ink)}
.ch-pct{font-family:var(--display);font-weight:800;font-size:clamp(40px,8vw,64px);line-height:1}
.ch-pct.hi{color:var(--ok)} .ch-pct.mid{color:var(--wait)} .ch-pct.lo{color:var(--ko)}
.ch-svg{width:100%;height:auto;display:block}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-ax{fill:var(--muted);font-size:11px;font-family:var(--body)}
.ch-zone{fill:var(--ko-bg);opacity:.6}
.ch-zl{fill:var(--ko);font-size:11px;font-weight:700;font-family:var(--body)}
.ch-ref{stroke-width:2;stroke-dasharray:6 6}
.ch-ref.no{stroke:var(--ko)} .ch-ref.cpr{stroke:#2563eb}
.ch-line{fill:none;stroke:var(--ink);stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.ch-dot{fill:var(--ko);stroke:var(--surface);stroke-width:3}
.ch-dot.cpr{fill:#2563eb}
.ch-ev{stroke-width:1.5;stroke-dasharray:3 4}
.ch-ev.cpr{stroke:#2563eb} .ch-ev.stop{stroke:var(--muted)} .ch-ev.shock{stroke:#ff8a00;stroke-width:3;stroke-dasharray:none}
.ch-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.ch-legend i.l{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
.ch-legend i.act{border-color:var(--ink)} .ch-legend i.no{border-color:var(--ko);border-top-style:dashed} .ch-legend i.cpr{border-color:#2563eb;border-top-style:dashed}
.ch-state{font-weight:700}
.ch-res{background:var(--ok-bg);color:var(--ink);border-radius:8px;padding:10px 12px}
.ch-big{min-height:54px;font-size:1.02rem}
.ch-cprbtn[aria-pressed="true"]{background:#2563eb;border-color:#2563eb;color:#fff}
.ch-shockbtn:not(:disabled){border-color:#ff8a00;color:#b45309;font-weight:700}
.ch-log{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:2px;font-size:.9rem}

/* ajustements charte sur les outils */
.dk[aria-pressed="true"]{background:var(--vert);color:#0d2a10}
.dk.cpr[aria-pressed="true"]{background:var(--bleu);color:#10112a}
.ch-cprbtn[aria-pressed="true"]{background:var(--marine);border-color:var(--marine);color:#fff}
.ch-ref.cpr{stroke:var(--bleu)} .ch-dot.cpr{fill:var(--bleu)} .ch-ev.cpr{stroke:var(--bleu)}
.rc-dial.insuf{border-color:var(--bleu)}
.df-n{color:#ffb15c;font-size:.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:60;max-width:calc(100vw - 32px)}
</style>

<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
/* ====== Outils RCP : socle ====== */
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[ch]));
let tt; function toast(m){ const t = document.getElementById("toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3200); }
const ICON = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#2E2F8D"/><path d="M32 52 C14 40 8 31 8 22.5 C8 15.5 13.5 10 20 10 C25 10 29.5 13 32 17.5 C34.5 13 39 10 44 10 C50.5 10 56 15.5 56 22.5 C56 31 50 40 32 52 Z" fill="#E83828"/><path d="M6 33 H20 L24 26 L29 41 L34 19 L38 33 H58" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
const ICO = {
  defib: `<svg viewBox="0 0 100 70" aria-hidden="true"><path d="M4 40 H24 L30 30 L36 40 H42 L48 8 L56 62 L62 40 H96" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/></svg>`,
  chrono: `<svg viewBox="0 0 70 70" aria-hidden="true"><circle cx="35" cy="39" r="25" fill="none" stroke="currentColor" stroke-width="6"/><path d="M35 39 V24 M28 6 H42 M35 6 V14" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg>`,
  rcp: `<svg viewBox="0 0 80 70" aria-hidden="true"><path d="M26 8 h28 v14 h-28 z M40 22 v14 M12 60 h56" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 38 l12 12 l12 -12" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  news: `<svg viewBox="0 0 70 70" aria-hidden="true"><path d="M14 8 h30 l12 12 v42 h-42 z M44 8 v12 h12 M24 34 h22 M24 44 h22 M24 54 h14" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,

  const vert = lin[0] * u[0] + lin[1] * u[1] + lin[2] * u[2];                              // accélération verticale
  RC.filt = RC.filt * 0.55 + vert * 0.45;                                                  // lissage
  const th = Math.max(1.2, RC.peakAmp * 0.35), t = rcNow();
  if (RC.filt < -th) RC.armed = true;
  if (RC.armed && RC.filt > th) {
    RC.armed = false;
    if (t - RC.lastDet > 0.25) rcDetected(t);
  }
  RC.peakAmp = Math.max(RC.peakAmp * 0.995, Math.abs(RC.filt));
}
function rcDetected(t){
  if (RC.lastDet && t - RC.lastDet < 2) { RC.times.push(t - RC.lastDet); if (RC.times.length > 5) RC.times.shift(); }
  else RC.times = [];
  RC.lastDet = t;
  if (RC.times.length >= 2) { const s = RC.times.slice().sort((x, y) => x - y); RC.rate = Math.round(60 / s[Math.floor(s.length / 2)]); }
  if (RC.running && RC.source !== "metro") { if (RC.phase === "insuf" && !RC.initial) { clearTimeout(RC.insufTimer); RC.phase = "comp"; RC.count = 0; RC.cycle++; } rcCompression(); }
  else rcPulse();
  rcGauge();
}
function rcTap(){ rcAudio(); rcDetected(rcNow()); }
function rcVerdict(r){
  if (r == null) return ["—", "", "En attente de compressions…"];
  if (r < 100) return [r, "lent", "Trop lent : accélère."];
  if (r > 120) return [r, "rapide", "Trop rapide : ralentis, laisse le thorax remonter."];
  return [r, "bon", "Bon rythme, continue."];
}
function rcGauge(){
  const el = document.getElementById("rc-rate"); if (!el) return;
  const [v, cls, txt] = rcVerdict(RC.rate);
  el.textContent = v; el.className = "rc-rate " + cls;
  const m = document.getElementById("rc-verdict"); if (m) { m.textContent = txt; m.className = "rc-verdict " + cls; }
  const nd = document.getElementById("rc-needle"); if (nd) { const r = RC.rate == null ? 110 : Math.max(70, Math.min(150, RC.rate)); nd.style.left = ((r - 70) / 80 * 100) + "%"; nd.style.opacity = RC.rate == null ? .25 : 1; }
}
function rcUpdate(){
  const n = RC_MODES[RC.mode].n;
  const big = document.getElementById("rc-count"), ph = document.getElementById("rc-phase"), cy = document.getElementById("rc-cycle"), dial = document.getElementById("rc-dial");
  if (!big) return;
  if (RC.phase === "vent") { big.textContent = String(RC.insuf); ph.textContent = "Insufflations"; dial.className = "rc-dial insuf"; }
  else if (RC.phase === "insuf") { big.textContent = RC.insuf + " / " + RC.insufTotal; ph.textContent = RC.initial ? "Insufflations initiales" : "Insufflations"; dial.className = "rc-dial insuf"; }
  else if (RC.phase === "comp") { big.textContent = n ? RC.count + " / " + n : String(RC.count); ph.textContent = "Compressions"; dial.className = "rc-dial comp"; }
  else { big.textContent = n ? "0 / " + n : "0"; ph.textContent = "Prêt"; dial.className = "rc-dial"; }
  cy.textContent = RC.mode === "ventil" ? RC_VENT[RC.vent][1] : RC.running ? (n ? "Cycle " + RC.cycle : "Compressions en continu") : RC_MODES[RC.mode].label;
  const go = document.getElementById("rc-go"); if (go) go.textContent = RC.running ? "Arrêter" : "Démarrer la RCP";
  const ms = document.getElementById("rc-ms"); if (ms) ms.textContent = RC.measuring ? "Arrêter la mesure" : "Mesurer avec le téléphone";
  const pm = document.getElementById("rc-perm"); if (pm) { pm.hidden = !RC.permission || RC.permission === "ok"; pm.textContent = RC.permission === "refus" ? "L’accès aux capteurs de mouvement a été refusé. Autorise-le dans les réglages du navigateur, ou utilise le mode « Appuis sur l’écran »." : "Aucun capteur de mouvement détecté sur cet appareil. Utilise un téléphone, ou le mode « Appuis sur l’écran »."; }
  const tp = document.getElementById("rc-tapzone"); if (tp) tp.hidden = RC.source !== "ecran";
  dial.style.setProperty("--beat", (60 / RC.bpm).toFixed(3) + "s");
  rcGauge();
}
function rcClick(a, b){
  if (a === "rc-go") { RC.running ? rcStop() : rcStart(); return; }
  if (a === "rc-ms") { RC.measuring ? rcMeasureStop() : rcMeasureStart(); return; }
  if (a === "rc-tap") { rcTap(); return; }
  if (a === "rc-mode") { RC.mode = b.dataset.v; rcStop(); }
  else if (a === "rc-vent") { RC.vent = b.dataset.v; if (RC.running && RC.phase === "vent") { clearTimeout(RC.insufTimer); RC.insufTimer = setTimeout(rcVentilate, 60000 / RC_VENT[RC.vent][0]); } }
  else if (a === "rc-src") { RC.source = b.dataset.v; if (RC.source === "capteur" && !RC.measuring) rcMeasureStart(); if (RC.running && RC.source === "metro") rcSchedule(); else clearTimeout(RC.timer); }
  else if (a === "rc-sound") RC.sound = !RC.sound;
  else if (a === "rc-relay") RC.relay = !RC.relay;
  const y = scrollY; render(); scrollTo(0, y);
}
function renderRcp(){
  setTimeout(rcUpdate, 0);
  const seg = (act, cur, list) => `<div class="seg" role="group">${list.map(([v, l]) => `<button data-act="${act}" data-v="${v}" aria-pressed="${cur === v}">${l}</button>`).join("")}</div>`;
  return `<div class="wrap wide">
    <header class="top"><div class="grow"><div class="eyebrow">Qualité de la RCP</div><h1>Métronome et compressions</h1></div></header>
    <div class="rc-grid">
      <section class="rc-main">
        <div class="rc-dial" id="rc-dial" style="--beat:${(60 / RC.bpm).toFixed(3)}s">
          <div class="rc-phase" id="rc-phase">Prêt</div>
          <div class="rc-count" id="rc-count">0 / 30</div>
          <div class="rc-cycle" id="rc-cycle"></div>
        </div>
        <div class="rc-row"><span class="mono">Temps <b id="rc-time">${rcFmt(RC.elapsed)}</b></span><span class="mono">${RC.mode === "ventil" ? "1 insufflation toutes les " + (60 / RC_VENT[RC.vent][0]) + " s" : RC.source === "metro" ? "Métronome " + RC.bpm + "/min" : RC.source === "capteur" ? "Comptage par le capteur" : "Comptage par appuis"}</span></div>
        <div class="rc-flash" id="rc-flash" hidden></div>
        <button class="btn primary rc-go" id="rc-go" data-act="rc-go">Démarrer la RCP</button>
        <button class="rc-tapzone" id="rc-tapzone" data-act="rc-tap" ${RC.source === "ecran" ? "" : "hidden"}>Appuie ici à chaque compression</button>
      </section>
      <section class="panel">
        <h2>Réglages</h2>
        <div class="choice"><span class="small muted">Victime</span>${seg("rc-mode", RC.mode, [["adulte","Adulte 30/2"],["enfant","Enfant, nourrisson 15/2"],["continu","Compressions seules"],["ventil","Insufflations seules"]])}</div>
        ${RC.mode === "ventil" ? `<div class="choice"><span class="small muted">Pouls perçu, ventilation absente ou anormale</span>${seg("rc-vent", RC.vent, [["adulte","Adulte, enfant 10/min"],["nourrisson","Nourrisson 20/min"],["nn","Nouveau-né 30/min"]])}</div>` : `<label class="f"><span>Rythme du métronome : <b class="mono" id="rc-bpm-out">${RC.bpm}</b> compressions/min</span><input type="range" id="rc-bpm" min="100" max="120" step="1" value="${RC.bpm}" data-rc="bpm"></label>
        <div class="choice"><span class="small muted">Compter les compressions</span>${seg("rc-src", RC.source, [["metro","Métronome"],["capteur","Capteur du téléphone"],["ecran","Appuis sur l’écran"]])}</div>`}
        <div class="actions"><button class="btn ${RC.sound ? "" : "ghost"}" data-act="rc-sound" aria-pressed="${RC.sound}">${RC.sound ? "Son activé" : "Son coupé"}</button><button class="btn ${RC.relay ? "" : "ghost"}" data-act="rc-relay" aria-pressed="${RC.relay}">${RC.relay ? "Relais toutes les 2 min" : "Sans relais"}</button></div>
      </section>
    </div>
    <section class="panel">
      <h2>Mesurer les compressions du stagiaire</h2>
      <p class="small" style="margin:0">Pose le téléphone à plat sur le thorax du mannequin, écran vers le haut, sous les mains ou à côté du point de compression. Il compte les compressions et affiche le rythme en direct.</p>
      <div class="rc-meter">
        <div class="rc-rate" id="rc-rate">—</div>
        <div class="rc-unit">compressions / min</div>
        <div class="rc-scale"><span class="z lent"></span><span class="z bon"></span><span class="z rapide"></span><i id="rc-needle"></i></div>
        <div class="rc-ticks"><span>70</span><span>100</span><span>120</span><span>150</span></div>
        <div class="rc-verdict" id="rc-verdict">En attente de compressions…</div>
      </div>
      <div class="actions"><button class="btn primary" id="rc-ms" data-act="rc-ms">Mesurer avec le téléphone</button></div>
      <div class="warn" id="rc-perm" hidden></div>
      <p class="small muted" style="margin:0">Le téléphone mesure le rythme, pas la profondeur : vérifie à l’œil une poussée verticale (adulte : environ 5 cm sans dépasser 6 cm) et un relâchement complet du thorax.</p>
    </section>
    <section class="panel">
      <h2>Les repères du référentiel</h2>
      <ul class="fra-list">
        <li>Fréquence comprise entre 100 et 120 compressions par minute, temps de compression égal au temps de relâchement.</li>
        <li>Adulte : cycles de 30 compressions et 2 insufflations. Enfant et nourrisson : cycles de 15 compressions et 2 insufflations.</li>
        <li><b>Nouveau 2026 :</b> plus d’insufflations initiales chez l’enfant, le nourrisson et le noyé. On débute toujours par les compressions.</li>
        <li>Adulte : talon de la main sur la moitié inférieure du sternum, bras tendus, coudes verrouillés, environ 5 cm sans dépasser 6 cm.</li>
        <li>Enfant : un tiers de l’épaisseur du thorax, soit environ 5 cm.</li>
        <li><b>Nouveau 2026 :</b> nourrisson et nouveau-né, pulpe des deux pouces superposés sur la moitié inférieure du sternum, mains autour du thorax, environ 4 cm.</li>
        <li>Laisser le thorax reprendre sa forme sans décoller le talon de la main ni les pouces.</li>
        <li>Relais aux compressions toutes les 2 minutes, pendant l’analyse du DAE si possible. Un intervenant peut tenir le rôle de « coach ».</li>
        <li>Insufflations impossibles (répulsion, vomissements, traumatisme de la face…) : compressions seules en continu à 100 à 120 par minute.</li>
        <li>Pouls perçu mais ventilation absente ou anormale (3 secouristes ou plus) : insufflations seules, 10 par minute chez l’adulte et l’enfant, 20 chez le nourrisson, 30 chez le nouveau-né.</li>
      </ul>
      <p class="small muted" style="margin:0">Référentiel départemental SSUAP SDIS 88 : 05-FT-11 Compressions thoraciques, 05-PR-05 et 05-PR-06 Arrêt cardiaque (version juillet 2026).</p>
    </section>
  </div>`;
}


render();

</script>
</body>
</html>
