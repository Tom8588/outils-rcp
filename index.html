<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outils RCP</title>
<meta name="description" content="Outils pédagogiques sur l'arrêt cardiaque pour les formations sapeurs-pompiers : défibrillation, chances de survie, qualité des compressions.">
<meta name="theme-color" content="#2E2F8D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Outils RCP">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/aileron@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/aileron@5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/aileron@5/900.css">
<script>
  // Capturé tôt pour proposer l'installation dès la première ouverture
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); window.__installEvt = e; window.dispatchEvent(new Event("installready")); });
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
<style>
/* Charte SDIS 88 : rouge, bleu clair, bleu foncé et vert de l'écusson ; typographie Aileron */
:root{
  --rouge:#E83828; --bleu:#7FB8E5; --marine:#2E2F8D; --vert:#59BB5C;
  --bg:#f2f4fa; --surface:#ffffff; --surface-2:#f5f6fb; --ink:#17183a; --muted:#585b78; --line:#d9dcea;
  --accent:var(--marine); --on-accent:#fff;
  --ok:#2f8a34; --ok-bg:#e3f3e4; --ko:#c8281a; --ko-bg:#fde6e3; --wait:#8a5a00; --wait-bg:#fdf0d6;
  --display:"Aileron","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:"Aileron","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0f22; --surface:#17183a; --surface-2:#1d1f46; --ink:#e8e9f6; --muted:#a3a6c6; --line:#2e3060;
  --accent:var(--bleu); --on-accent:#10112a;
  --ok:#7fd283; --ok-bg:#16301b; --ko:#ff8a7c; --ko-bg:#3d1714; --wait:#f3c265; --wait-bg:#33270e; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e0f22; --surface:#17183a; --surface-2:#1d1f46; --ink:#e8e9f6; --muted:#a3a6c6; --line:#2e3060;
  --accent:var(--bleu); --on-accent:#10112a;
  --ok:#7fd283; --ok-bg:#16301b; --ko:#ff8a7c; --ko-bg:#3d1714; --wait:#f3c265; --wait-bg:#33270e; color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;margin:0;min-height:100vh}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:18px 64px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:900;margin:0;text-wrap:balance;line-height:1.12;letter-spacing:-.005em}
h1{font-size:clamp(1.6rem,4.5vw,2.2rem)} h2{font-size:1.3rem} h3{font-size:1.1rem}
.eyebrow{font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.78rem;color:var(--rouge)}
.muted{color:var(--muted)} .small{font-size:.88rem} .mono{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--bleu);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .grow{flex:1;min-width:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;min-height:44px;display:inline-flex;align-items:center;gap:8px;justify-content:center;font-weight:700}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--muted);min-width:0}
input[type=range]{accent-color:var(--accent);width:100%}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:10px 14px;min-height:44px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.choice{display:flex;flex-direction:column;gap:6px}
/* bandeau */
.bar{background:var(--marine);color:#fff;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.bar-in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:60px}
.bar a.home{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.bar .wm{font-family:var(--display);font-weight:900;font-size:1.35rem;letter-spacing:.02em}
.bar .wm span{color:var(--bleu)}
.bar .sp{flex:1}
.bar .back{text-decoration:none;color:#fff;border-color:rgba(255,255,255,.35);background:transparent;min-height:40px}
.stripes{display:flex;height:5px}
.stripes i{flex:1}
.stripes i:nth-child(1){background:var(--rouge)} .stripes i:nth-child(2){background:var(--bleu)} .stripes i:nth-child(3){background:var(--vert)} .stripes i:nth-child(4){background:#fff}
/* accueil */
.hero{display:flex;flex-direction:column;gap:6px;padding:6px 0 2px}
.hero p{margin:0;max-width:62ch;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{text-decoration:none;display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;text-decoration:none;color:inherit}
.card:hover{border-color:var(--muted)}
.card .vis{height:96px;display:grid;place-items:center;color:#fff}
.card .vis svg{height:64px;width:auto}
.card.c1 .vis{background:var(--rouge)} .card.c2 .vis{background:var(--marine)} .card.c3 .vis{background:var(--vert)} .card.c4 .vis{background:var(--bleu);color:var(--marine)} .card.c5 .vis{background:linear-gradient(135deg,var(--marine) 0 60%,var(--rouge) 60%)}
.card .tx{padding:4px 16px 16px;display:flex;flex-direction:column;gap:4px}
.card b{font-family:var(--display);font-weight:900;font-size:1.2rem}
.card .tx span{color:var(--muted);font-size:.92rem}
.install{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1.5px solid var(--bleu);border-radius:var(--r);padding:12px 14px}
.install .grow{flex:1;min-width:200px}
.install svg{flex:none;border-radius:10px}
.foot{font-size:.8rem;color:var(--muted);text-align:center;margin-top:8px}
/* nouveautés */
.nv{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.nv .panel{border-top:5px solid var(--rouge)}
.nv .panel:nth-child(2){border-top-color:var(--bleu)} .nv .panel:nth-child(3){border-top-color:var(--vert)}
.nv p{margin:0}
.tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.org{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.org > div{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2)}
.org b{font-family:var(--display);font-weight:900;font-size:1.25rem;display:block}
.org .i{border-left:5px solid var(--vert)} .org .e{border-left:5px solid var(--marine)} .org .a{border-left:5px solid var(--rouge)}
.fiches{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;max-width:calc(100% - 32px)}
.warn{background:var(--wait-bg);color:var(--wait);border-radius:8px;padding:10px 12px;font-size:.9rem}
/* défibrillation */
.df{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:14px;align-items:stretch}
@media (max-width:760px){.df{grid-template-columns:1fr}}
.df-screen{position:relative;background:#050a08;border-radius:16px;border:10px solid #2a302d;box-shadow:inset 0 0 0 1px #000;padding:10px 12px 12px;min-width:0;overflow:hidden;
  background-image:linear-gradient(rgba(57,255,136,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(57,255,136,.07) 1px,transparent 1px),linear-gradient(rgba(57,255,136,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(57,255,136,.03) 1px,transparent 1px);
  background-size:50px 50px,50px 50px,10px 10px,10px 10px;background-position:12px 10px}
.df-screen canvas{display:block;width:100%;height:clamp(260px,42vw,420px)}
.df-head{display:flex;align-items:baseline;gap:14px;color:#39ff88;font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:1rem}
.df-head .df-lab{flex:1;color:#39ff88;opacity:.85}
.df-hr{color:#39ff88;font-variant-numeric:tabular-nums}
.df-hr b{font-size:2.6rem;line-height:1}
.df-hr small{font-size:.8rem;opacity:.8}
.df-p{position:absolute;left:14px;top:72%;color:#4fd2ff;font-family:var(--display);font-weight:700;font-size:.85rem;letter-spacing:.06em;opacity:.85}
.df-msg{margin-top:8px;padding:8px 12px;min-height:2.6em;border-radius:8px;font-weight:700;font-size:.95rem;background:rgba(255,255,255,.1);color:#fff}
.df-msg.idle{color:rgba(255,255,255,.45);background:rgba(255,255,255,.05)}
.df-msg.warn{background:rgba(255,190,40,.18);color:#ffd36b}
.df-msg.alert{background:rgba(255,120,0,.25);color:#ffb15c}
.df-msg.ok{background:rgba(57,255,136,.16);color:#8dffbd}
.df-screen.flash::after{content:"";position:absolute;inset:0;background:#fff;animation:dfflash .45s ease-out forwards;pointer-events:none}
@keyframes dfflash{from{opacity:.95}to{opacity:0}}
.df-keys{display:flex;flex-direction:column;gap:10px;background:#2a302d;border-radius:16px;padding:12px}
@media (max-width:760px){.df-keys{display:grid;grid-template-columns:repeat(3,1fr)}.df-keys .dk{flex-direction:column;text-align:center;gap:4px;font-size:.85rem}.df-keys .dk.cpr{grid-column:span 2;flex-direction:row}}
.dk{display:flex;align-items:center;gap:10px;min-height:56px;border-radius:12px;border:0;background:#3a423e;color:#e8efeb;padding:8px 12px;font-weight:700;text-align:left;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.dk .ico{width:40px;flex:none;display:grid;place-items:center}
.dk .ico svg{width:38px;height:auto}
.dk[aria-pressed="true"]{background:#16a34a;color:#fff}
.dk.cpr[aria-pressed="true"]{background:#2563eb}
.dk:active{transform:translateY(1px)}
.dk.shock{flex-direction:column;justify-content:center;min-height:120px;background:#3a423e;gap:4px}
.dk.shock svg{width:76px;height:auto;opacity:.55;filter:grayscale(.4)}
.dk.shock.ready svg{opacity:1;filter:none;animation:shockblink .8s steps(2,end) infinite}
.dk.shock.ready{box-shadow:0 0 0 3px #ff8a00,inset 0 -3px 0 rgba(0,0,0,.35)}
@keyframes shockblink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.dk.shock.ready svg{animation:none}.df-screen.flash::after{animation-duration:.01s}}
.df-keys .btn.small{min-height:36px;padding:6px 10px;font-size:.85rem;background:transparent;color:#cfd8d3;border-color:#56605b}
@media (max-width:760px){.dk.shock{grid-column:span 3}}
#df-explain h3{margin:0}
#df-explain p{margin:0;max-width:75ch}

.fra-list{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
/* métronome RCP */
.rc-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.rc-grid{grid-template-columns:1fr}}
.rc-main{background:#0f1714;color:#eaf5ef;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center}
.rc-dial{width:min(78vw,300px);aspect-ratio:1;border-radius:50%;background:#0b120f;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:10px solid #22342c;position:relative}
.rc-dial.comp{border-color:#1d7a45}
.rc-dial.insuf{border-color:#2563eb}
.rc-dial.beat{animation:rcbeat var(--beat,.55s) ease-out}
@keyframes rcbeat{0%{box-shadow:0 0 0 0 rgba(76,194,122,.65);transform:scale(.965)}100%{box-shadow:0 0 0 26px rgba(76,194,122,0);transform:scale(1)}}
.rc-phase{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9fd9b5;font-size:1rem}
.rc-dial.insuf .rc-phase{color:#9cc0ff}
.rc-count{font-family:var(--display);font-weight:800;font-size:clamp(40px,11vw,72px);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;color:#fff}
.rc-cycle{font-size:.9rem;color:#a9b8b0}
.rc-row{display:flex;justify-content:space-between;gap:12px;width:100%;font-size:.9rem;color:#a9b8b0;flex-wrap:wrap}
.rc-row b{color:#fff}
.rc-go{width:100%;min-height:56px;font-size:1.1rem}
.rc-flash{width:100%;background:#7a4a00;color:#ffd99a;border-radius:10px;padding:10px 12px;font-weight:700;text-align:center}
.rc-tapzone{width:100%;min-height:160px;border-radius:16px;border:2px dashed #3d6b52;background:#15231d;color:#cfe9da;font-weight:700;font-size:1.1rem;touch-action:manipulation}
.rc-tapzone:active{background:#1d3a2c}
.rc-meter{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.rc-rate{font-family:var(--display);font-weight:800;font-size:clamp(56px,16vw,96px);line-height:1;font-variant-numeric:tabular-nums;color:var(--muted)}
.rc-rate.bon{color:var(--ok)} .rc-rate.lent,.rc-rate.rapide{color:var(--ko)}
.rc-unit{color:var(--muted);font-size:.9rem}
.rc-scale{position:relative;width:min(100%,460px);height:14px;border-radius:7px;display:flex;overflow:visible;margin-top:8px}
.rc-scale .z{height:100%}
.rc-scale .z.lent{flex:30;background:var(--ko-bg);border-radius:7px 0 0 7px}
.rc-scale .z.bon{flex:20;background:var(--ok)}
.rc-scale .z.rapide{flex:30;background:var(--ko-bg);border-radius:0 7px 7px 0}
.rc-scale i{position:absolute;top:-6px;width:4px;height:26px;margin-left:-2px;background:var(--ink);border-radius:2px;transition:left .25s ease-out;left:50%}
.rc-ticks{position:relative;width:min(100%,460px);height:16px;font-size:.75rem;color:var(--muted)}
.rc-ticks span{position:absolute;transform:translateX(-50%)}
.rc-ticks span:nth-child(1){left:0;transform:none}.rc-ticks span:nth-child(2){left:37.5%}.rc-ticks span:nth-child(3){left:62.5%}.rc-ticks span:nth-child(4){right:0;left:auto;transform:none}
.rc-verdict{font-weight:700;color:var(--muted)}
.rc-verdict.bon{color:var(--ok)} .rc-verdict.lent,.rc-verdict.rapide{color:var(--ko)}
@media (prefers-reduced-motion: reduce){.rc-dial.beat{animation:none}}

/* chrono arrêt cardiaque */
.ch-grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.ch-grid2{grid-template-columns:1fr}}
.ch-main{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ch-top{display:flex;justify-content:space-between;gap:12px;color:var(--muted)}
.ch-time{font-family:var(--display);font-weight:800;font-size:clamp(40px,8vw,64px);line-height:1;color:var(--ink)}
.ch-pct{font-family:var(--display);font-weight:800;font-size:clamp(40px,8vw,64px);line-height:1}
.ch-pct.hi{color:var(--ok)} .ch-pct.mid{color:var(--wait)} .ch-pct.lo{color:var(--ko)}
.ch-svg{width:100%;height:auto;display:block}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-ax{fill:var(--muted);font-size:11px;font-family:var(--body)}
.ch-zone{fill:var(--ko-bg);opacity:.6}
.ch-zl{fill:var(--ko);font-size:11px;font-weight:700;font-family:var(--body)}
.ch-ref{stroke-width:2;stroke-dasharray:6 6}
.ch-ref.no{stroke:var(--ko)} .ch-ref.cpr{stroke:#2563eb}
.ch-line{fill:none;stroke:var(--ink);stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.ch-dot{fill:var(--ko);stroke:var(--surface);stroke-width:3}
.ch-dot.cpr{fill:#2563eb}
.ch-ev{stroke-width:1.5;stroke-dasharray:3 4}
.ch-ev.cpr{stroke:#2563eb} .ch-ev.stop{stroke:var(--muted)} .ch-ev.shock{stroke:#ff8a00;stroke-width:3;stroke-dasharray:none}
.ch-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.ch-legend i.l{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
.ch-legend i.act{border-color:var(--ink)} .ch-legend i.no{border-color:var(--ko);border-top-style:dashed} .ch-legend i.cpr{border-color:#2563eb;border-top-style:dashed}
.ch-state{font-weight:700}
.ch-res{background:var(--ok-bg);color:var(--ink);border-radius:8px;padding:10px 12px}
.ch-big{min-height:54px;font-size:1.02rem}
.ch-cprbtn[aria-pressed="true"]{background:#2563eb;border-color:#2563eb;color:#fff}
.ch-shockbtn:not(:disabled){border-color:#ff8a00;color:#b45309;font-weight:700}
.ch-log{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:2px;font-size:.9rem}
.rc-meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 20px}
.rc-dticks span:nth-child(2){left:50%}.rc-dticks span:nth-child(3){left:66.7%}
.rc-duty{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.rc-split{display:flex;width:min(100%,520px);border-radius:8px;overflow:hidden;font-size:.82rem;font-weight:700}
.rc-split i{font-style:normal;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-split i:first-child{background:var(--marine);color:#fff}.rc-split i:last-child{background:var(--bleu);color:#10112a}
.rc-bilan{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.rc-bilan div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.rc-bilan b{font-size:1.4rem;font-weight:900}
.rc-bilan span{font-size:.8rem;color:var(--muted)}
.linklike{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-weight:700}
.rc-rate.juste,.rc-verdict.juste{color:var(--wait)}
/* chronologie en équipe */
.eq-live{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.eq-live{grid-template-columns:1fr}}
.eq-main{background:#0f1030;color:#eef0ff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.eq-top{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.eq-time{font-weight:900;font-size:clamp(44px,9vw,68px);line-height:1}
.eq-kpi{display:flex;gap:16px;flex-wrap:wrap}
.eq-kpi > div{display:flex;flex-direction:column;gap:2px;min-width:110px}
.eq-kpi .small{color:#aab0e0}
.eq-big{font-weight:900;font-size:1.9rem;line-height:1.05}
.eq-big.hi{color:#7fd283} .eq-big.mid{color:#f3c265} .eq-big.lo{color:#ff8a7c}
.eq-comp{border:0;border-radius:16px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#2a2c66;color:#fff;box-shadow:inset 0 0 0 3px #4a4ea0}
.eq-comp b{font-size:clamp(1.3rem,4vw,1.8rem);font-weight:900}
.eq-comp small{opacity:.8}
.eq-comp.on{background:var(--vert);color:#0d2a10;box-shadow:none}
.eq-pause{font-weight:900;font-size:1.2rem;text-align:center;padding:8px;border-radius:10px;background:rgba(255,255,255,.08)}
.eq-pause.mid{background:rgba(243,194,101,.22);color:#ffd98a} .eq-pause.lo{background:rgba(232,56,40,.35);color:#fff}

<body>

<script>
/* ====== Outils RCP : socle ====== */
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[ch]));

const ICON = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#2E2F8D"/><path d="M32 52 C14 40 8 31 8 22.5 C8 15.5 13.5 10 20 10 C25 10 29.5 13 32 17.5 C34.5 13 39 10 44 10 C50.5 10 56 15.5 56 22.5 C56 31 50 40 32 52 Z" fill="#E83828"/><path d="M6 33 H20 L24 26 L29 41 L34 19 L38 33 H58" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
const ICO = {
  defib: `<svg viewBox="0 0 100 70" aria-hidden="true"><path d="M4 40 H24 L30 30 L36 40 H42 L48 8 L56 62 L62 40 H96" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/></svg>`,
  chrono: `<svg viewBox="0 0 70 70" aria-hidden="true"><circle cx="35" cy="39" r="25" fill="none" stroke="currentColor" stroke-width="6"/><path d="M35 39 V24 M28 6 H42 M35 6 V14" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg>`,
  rcp: `<svg viewBox="0 0 80 70" aria-hidden="true"><path d="M26 8 h28 v14 h-28 z M40 22 v14 M12 60 h56" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 38 l12 12 l12 -12" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  team: `<svg viewBox="0 0 90 70" aria-hidden="true"><path d="M6 18 H84 M6 36 H84 M6 54 H84" stroke="currentColor" stroke-width="3" opacity=".45"/><rect x="8" y="12" width="30" height="12" rx="3" fill="currentColor"/><rect x="44" y="30" width="22" height="12" rx="3" fill="currentColor"/><rect x="30" y="48" width="44" height="12" rx="3" fill="currentColor"/></svg>`,
  news: `<svg viewBox="0 0 70 70" aria-hidden="true"><path d="M14 8 h30 l12 12 v42 h-42 z M44 8 v12 h12 M24 34 h22 M24 44 h22 M24 54 h14" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};
const ROUTES = ["accueil", "defib", "chrono", "rcp", "equipe", "nouveau", "exercice"];
const route = () => { const h = (location.hash || "").replace("#", ""); return ROUTES.includes(h) ? h : "accueil"; };
let lastRoute = null;

/* --- installation --- */
const isStandalone = () => { try { return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; } catch (e) { return false; } };
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let installHidden = false; try { installHidden = sessionStorage.getItem("rcp-noinstall") === "1"; } catch (e) {}
function installBanner(){
  if (installHidden || isStandalone()) return "";
  const evt = window.__installEvt;
  const how = evt ? "Elle s’ouvrira comme une application, avec son icône, même sans réseau."
    : isIOS() ? "Dans Safari, touche le bouton Partager, puis « Sur l’écran d’accueil »."
    : "Dans le menu du navigateur, choisis « Installer l’application » ou « Ajouter à l’écran d’accueil ».";
  return `<div class="install">${ICON(48)}<div class="grow"><b>Installer Outils RCP sur cet appareil</b><div class="small muted">${how}</div></div>
    ${evt ? `<button class="btn primary" data-act="install">Installer l’appli</button>` : ""}<button class="btn ghost" data-act="noinstall">Plus tard</button></div>`;
}
window.addEventListener("installready", () => { if (route() === "accueil") render(); });
window.addEventListener("appinstalled", () => { installHidden = true; render(); toast("Appli installée."); });

/* --- rendu --- */
function bar(r){
  return `<header class="bar"><div class="bar-in">
      <a class="home" href="#accueil" aria-label="Accueil Outils RCP">${ICON(38)}<span class="wm">OUTILS <span>RCP</span></span></a>
      <span class="sp"></span>${r !== "accueil" ? `<a class="btn back" href="#accueil">← Accueil</a>` : ""}
    </div><div class="stripes"><i></i><i></i><i></i><i></i></div></header>`;
}
function renderHome(){
  const card = (c, href, ico, t, d) => `<a class="card ${c}" href="#${href}"><span class="vis">${ico}</span><span class="tx"><b>${t}</b><span>${d}</span></span></a>`;
  return `<div class="wrap">
    ${installBanner()}
    <div class="hero"><div class="eyebrow">Formation continue SSUAP · Arrêt cardiaque</div><h1>Faire comprendre l’arrêt cardiaque, du tracé au geste</h1>
      <p>Des outils à projeter ou à faire manipuler en formation, alignés sur le référentiel départemental SSUAP 2026.</p></div>
    <div class="cards">
      ${card("c1", "defib", ICO.defib, "Défibrillation", "Moniteur ECG : rythme sinusal, asystolie, fibrillation, effet du choc et du massage.")}
      ${card("c2", "chrono", ICO.chrono, "Chances de survie", "Le graphe évolue en direct : chaque minute sans geste coûte 10 % de chances.")}
      ${card("c3", "rcp", ICO.rcp, "Compressions", "Métronome, relais, et mesure du rythme et de l’enfoncement avec le téléphone posé sur le mannequin. Mode exercice plein écran.")}

      ${card("c4", "nouveau", ICO.news, "Ce qui change en 2026", "Les nouveautés des fiches arrêt cardiaque, et qui fait quoi entre ILCOR, ERC et AHA.")}
    </div>
    <p class="foot">Outils pédagogiques : ils illustrent les principes et ne remplacent ni le référentiel ni les indications du DAE.</p>

}
function renderNews(){
  return `<div class="wrap">
    <header class="top"><div class="grow"><div class="eyebrow">Formation continue 2027</div><h1>Ce qui change en 2026</h1></div></header>
    <div class="nv">
      <section class="panel"><span class="tag">Insufflations</span><h2>Toujours commencer par les compressions</h2>
        <p>Les 5 insufflations initiales sont supprimées chez l’enfant, le nourrisson et le noyé. Aucune étude chez l’homme ne prouve qu’elles améliorent la survie (ILCOR). La commission médicale s’aligne ici sur l’AHA plutôt que sur l’ERC, pour simplifier les procédures et l’enseignement.</p>
        <p>Le rapport reste de <b>15 compressions pour 2 insufflations</b> chez l’enfant et le nourrisson, <b>30 pour 2</b> chez l’adulte.</p></section>
      <section class="panel"><span class="tag">Compressions</span><h2>Nourrisson : les deux pouces</h2>
        <p>La technique des <b>pouces superposés</b> au centre de la poitrine, sur la moitié inférieure du sternum, devient la seule technique chez le nourrisson, pour le citoyen comme pour l’opérationnel. Elle sert aussi en cas d’obstruction des voies aériennes du nourrisson, si les claques dans le dos sont inefficaces.</p>
        <p>La position est uniformisée pour l’adulte, l’enfant et le nourrisson.</p></section>
      <section class="panel"><span class="tag">Électrodes</span><h2>FV réfractaire : changer de vecteur</h2>
        <p>Après <b>3 chocs inefficaces</b>, sur indication médicale, l’équipe peut passer en position <b>antéro-postérieure</b> avec une nouvelle paire d’électrodes (recommandé par l’ERC).</p>
        <p>Une équipe médicale sur place peut tenter la double défibrillation séquentielle : 2 chocs espacés de moins d’une seconde, avec un DAE et un défibrillateur manuel. Elle fait encore l’objet d’études.</p></section>
    </div>
    <section class="panel"><h2>ILCOR, ERC, AHA : qui fait quoi ?</h2>
      <div class="org">
        <div class="i"><b>ILCOR</b><span class="small muted">Comité international de liaison sur la réanimation</span><p class="small" style="margin:6px 0 0">Analyse les études scientifiques internationales et construit un consensus sur les bonnes pratiques de réanimation.</p></div>
        <div class="e"><b>ERC</b><span class="small muted">Conseil européen de réanimation</span><p class="small" style="margin:6px 0 0">Adapte et diffuse des recommandations pour l’Europe, à partir des travaux de l’ILCOR.</p></div>
        <div class="a"><b>AHA</b><span class="small muted">Association américaine de cardiologie</span><p class="small" style="margin:6px 0 0">Publie des recommandations de réanimation et d’urgence cardiovasculaire, principalement pour les États-Unis.</p></div>
      </div>
      <p class="small" style="margin:0"><b>À retenir :</b> ILCOR = consensus scientifique international · ERC = référence européenne · AHA = référence américaine.</p></section>
    <section class="panel"><h2>Fiches concernées <span class="small muted">(numérotation nationale)</span></h2>
      <ul class="fiches">
        <li><b>PSE 1</b> · 05AC05 Arrêt cardiaque, 05PR04 Arrêt cardiaque en équipe, 05PR05 Arrêt cardiaque en sauveteur isolé (09-2026) : reformulation complète, compressions d’abord, alignement sur le PSC.</li>
        <li><b>PSE 1</b> · 05FT10 Compressions thoraciques (09-2026) : nourrisson aux 2 pouces, position uniformisée.</li>
        <li><b>PSE 1</b> · 05FT16 Utilisation d’un DAE (09-2026) : ajout de la position antéro-postérieure comme cas particulier.</li>
        <li><b>PSC</b> · 02PR03 Arrêt cardiaque, 02FT07 Compressions thoraciques (09-2026) : mêmes évolutions.</li>
      </ul>

  </div>`;
}
function render(){

  document.body.classList.toggle("exo-on", r === "exercice");
  document.getElementById("app").innerHTML = (r === "exercice" ? "" : bar(r)) + views[r]();
  document.title = { accueil: "Outils RCP", defib: "Défibrillation · Outils RCP", chrono: "Chances de survie · Outils RCP", rcp: "Compressions · Outils RCP", equipe: "Chronologie en équipe · Outils RCP", nouveau: "Ce qui change · Outils RCP", exercice: "Mode exercice · Outils RCP" }[r];

window.addEventListener("hashchange", render);

/* --- interactions --- */

  const a = b.dataset.act;

  if (a.startsWith("ch-")) return chClick(a, b);
  if (a.startsWith("rc-")) return rcClick(a, b);
  if (a.startsWith("eq-")) return eqClick(a, b);
  if (a.startsWith("exo-")) return exoClick(a, b);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.rc === "bpm") { RC.bpm = Number(t.value); const o = document.getElementById("rc-bpm-out"); if (o) o.textContent = RC.bpm; const d = document.getElementById("rc-dial"); if (d) d.style.setProperty("--beat", (60 / RC.bpm).toFixed(3) + "s"); if (RC.running && RC.source === "metro") rcSchedule(); }

const DF = {
  rhythm: "sinus",      // sinus | asys | fv | post
  cpr: false, fvAmp: 1, weak: 1, cycleDone: false, ready: false, analysing: false, sound: false,
  t: 0, beatT: 0, hr: 75, nextRR: 0.8, beats: [], shockT: -99, pauseUntil: 0, outcome: null,
  phiA: 0, phiB: 0, phiC: 0, modA: 0, modB: 0,
  x: 0, prevE: null, prevP: null, loop: null, last: 0, timer: null, analyseTimer: null, msg: "", msgKind: "",

const DF_TEXT = {
  sinus: ["Rythme normal (sinusal)", "Chaque battement suit le même chemin électrique : l’onde P (contraction des oreillettes), le complexe QRS (contraction des ventricules) puis l’onde T (récupération). Le cœur pompe, le sang circule."],

/* --- profondeur : reconstruction spectrale du déplacement ---
   Les compressions sont quasi périodiques : on décompose l'accélération verticale des dernières
   compressions en harmoniques de la fréquence de massage, puis on divise chaque harmonique par ω².
   On obtient la forme du déplacement, donc la profondeur (crête à crête) et la part du cycle passée
   à comprimer. Méthode classique des aides au massage à accéléromètre ; précision de l'ordre du cm. */
function rcDepthCalc(){

  const s = RC.times.slice().sort((x, y) => x - y), T = s[Math.floor(s.length / 2)], f = 1 / T;

    const [ta, va] = RC.buf[j], [tb, vb] = RC.buf[j + 1] || RC.buf[j]; A[i] = tb > ta ? va + (vb - va) * (t - ta) / (tb - ta) : va;

  return { depth, duty: comp / T };

  if (on) bars += `<rect x="${x(since)}" y="40" width="${x(end) - x(since)}" height="26" class="eq-on"/>`;
  const lastX = { up: [-99, -99], dn: [-99, -99] };
  const mk = ev.filter(e => ["dae", "analyse", "choc", "nochoc", "relais", "o2", "alerte"].includes(e.k)).map(e => {
    const X = x(e.t), up = ["dae", "analyse", "choc", "nochoc"].includes(e.k), side = up ? "up" : "dn";
    if (e.k === "choc") return `<g class="eq-mk choc"><line x1="${X}" x2="${X}" y1="34" y2="70"/><path d="M${X} 34 l6 -11 h-12 z"/></g>`;
    let row = lastX[side].findIndex(v => X - v > 46); if (row < 0) row = lastX[side][0] < lastX[side][1] ? 0 : 1; lastX[side][row] = X;
    const ty = up ? (row ? 12 : 26) : (row ? 104 : 90);
    return `<g class="eq-mk ${e.k}"><line x1="${X}" x2="${X}" y1="${up ? ty + 4 : 40}" y2="${up ? 66 : ty - 10}"/><text x="${X}" y="${ty}" text-anchor="middle">${esc(EQ_EV[e.k].short)}</text></g>`;
  }).join("");
  let ticks = ""; const step = end > 600 ? 120 : end > 240 ? 60 : 30;
  for (let t = 0; t <= end; t += step) ticks += `<text x="${x(t)}" y="${H - 2}" text-anchor="middle" class="eq-ax">${eqFmt(t)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H + 8}" class="eq-svg" role="img" aria-label="Chronologie de l’intervention : compressions et événements"><rect x="${L}" y="40" width="${W - L - R}" height="26" class="eq-off"/>${bars}${mk}${ticks}</svg>`;
}
function eqDebrief(rec){
  const m = eqAnalyse(rec), s = m.s, d = new Date(rec.date);
  const team = { "2": "2 secouristes sans DAE au départ", "2dae": "2 secouristes avec DAE", "3": "3 secouristes ou plus" }[rec.team];
  const tile = (v, l, cls) => `<div class="eq-tile ${cls || ""}"><b class="mono">${v}</b><span>${l}</span></div>`;
  return `<section class="panel">
      <div class="actions" style="justify-content:space-between"><div><div class="eyebrow">Débriefing</div><h2>${esc(rec.label || "Exercice")} · ${d.toLocaleDateString("fr-FR")} ${d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}</h2><div class="small muted">${team} · durée ${eqDur(rec.end)}</div></div>
        <div class="actions"><button class="btn" data-act="eq-print">Imprimer</button><button class="btn primary" data-act="eq-new">Nouvel exercice</button></div></div>
      <div class="eq-tiles">
        ${tile(s.ccf == null ? "—" : Math.round(s.ccf * 100) + " %", "fraction de compressions", s.ccf == null ? "" : s.ccf >= 0.8 ? "hi" : s.ccf >= 0.6 ? "mid" : "lo")}
        ${tile(m.first.comp == null ? "—" : eqDur(m.first.comp), "avant la 1re compression", m.first.comp != null && m.first.comp <= 15 ? "hi" : "mid")}
        ${tile(m.first.dae == null ? "—" : eqFmt(m.first.dae), "DAE en place")}
        ${tile(m.first.choc == null ? "—" : eqFmt(m.first.choc), "1er choc")}
        ${tile(String(m.chocs.length), "choc" + (m.chocs.length > 1 ? "s" : ""))}
        ${tile(String(m.longPauses.length), "pause" + (m.longPauses.length > 1 ? "s" : "") + " de plus de 10 s", m.longPauses.length ? "lo" : "hi")}
        ${tile(String(m.relais.length), "relais")}
      </div>
      ${eqTimeline(rec)}
      <div class="eq-leg small"><span><i class="on"></i>Compressions</span><span><i class="off"></i>Sans compressions</span><span><i class="sh"></i>Choc</span></div>
      <div class="eq-cols">
        <div><h3>Points forts</h3><ul class="fra-list">${m.good.map(x => `<li>${esc(x)}</li>`).join("") || "<li>—</li>"}</ul></div>
        <div><h3>À travailler</h3><ul class="fra-list">${m.todo.map(x => `<li>${esc(x)}</li>`).join("") || "<li>Rien à signaler.</li>"}</ul></div>
      </div>
      <details class="small"><summary><b>Tous les événements</b></summary><ol class="ch-log" style="margin-top:6px">${rec.ev.map(e => `<li><span class="mono">${eqFmt(e.t)}</span> ${esc(EQ_EV[e.k].l)}</li>`).join("")}</ol></details>
    </section>`;
}
function eqClick(a, b){
  if (a === "eq-team") { EQ.team = b.dataset.v; render(); return; }
  if (a === "eq-start") { const i = document.getElementById("eq-label"); EQ.label = i ? i.value.trim() : ""; eqStart(); return; }
  if (a === "eq-ev") { eqAdd(b.dataset.v); return; }
  if (a === "eq-undo") { if (EQ.ev.length > 1) EQ.ev.pop(); eqTick(); eqLog(); return; }
  if (a === "eq-end") { eqFinish(); return; }
  if (a === "eq-abort" && !b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Confirmer l’abandon"; b.classList.add("danger"); setTimeout(() => { if (b.isConnected) { delete b.dataset.sure; b.textContent = "Abandonner"; b.classList.remove("danger"); } }, 4000); return; }
  if (a === "eq-abort") { EQ.running = false; clearInterval(EQ.timer); EQ.view = "live"; EQ.ev = []; render(); return; }
  if (a === "eq-new") { EQ.view = "live"; EQ.open = null; render(); scrollTo(0, 0); return; }
  if (a === "eq-open") { EQ.open = b.dataset.v; EQ.view = "debrief"; render(); scrollTo(0, 0); return; }
  if (a === "eq-del") { EQ.hist = EQ.hist.filter(h => h.id !== b.dataset.v); try { localStorage.setItem("rcp-equipe", JSON.stringify(EQ.hist)); } catch (e) {} if (EQ.open === b.dataset.v) { EQ.open = null; EQ.view = "live"; } render(); return; }
  if (a === "eq-print") { window.print(); return; }
}
function renderEquipe(){
  const head = `<header class="top"><div class="grow"><div class="eyebrow">Exercice en équipe</div><h1>Chronologie de l’ACR</h1></div></header>`;
  const hist = EQ.hist.length ? `<section class="panel eq-hist"><h2>Exercices enregistrés</h2><div class="eq-hl">${EQ.hist.map(h => { const s = eqState(h.ev, h.end), d = new Date(h.date); return `<div class="eq-hrow"><button class="linklike" data-act="eq-open" data-v="${h.id}">${esc(h.label || "Exercice")} · ${d.toLocaleDateString("fr-FR")} ${d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}</button><span class="small muted mono">${eqDur(h.end)} · ${s.ccf == null ? "—" : Math.round(s.ccf * 100) + " %"}</span><button class="btn ghost" data-act="eq-del" data-v="${h.id}" aria-label="Supprimer">Supprimer</button></div>`; }).join("")}</div><p class="small muted" style="margin:0">Enregistrés sur cet appareil uniquement.</p></section>` : "";
  if (EQ.view === "debrief") { const rec = EQ.hist.find(h => h.id === EQ.open); if (rec) return `<div class="wrap">${head}${eqDebrief(rec)}${hist}</div>`; }
  if (!EQ.running) {
    const seg = `<div class="seg" role="group">${[["2", "2 sans DAE"], ["2dae", "2 avec DAE"], ["3", "3 ou plus"]].map(([v, l]) => `<button data-act="eq-team" data-v="${v}" aria-pressed="${EQ.team === v}">${l}</button>`).join("")}</div>`;
    const org = { "2": "Un secouriste poursuit le massage, le second va chercher un DAE et demande un renfort médical.", "2dae": "Un secouriste poursuit le massage, le second met en œuvre le DAE puis demande un renfort médical immédiatement après la première analyse.", "3": "Les trois actions (alerte, RCP et DAE) sont réalisées simultanément." }[EQ.team];
    return `<div class="wrap">${head}
      <section class="panel">
        <p style="margin:0">Pendant l’exercice, un observateur signale chaque action d’un appui. À la fin, l’appli calcule le temps passé sans compressions, les délais, les relais, et propose un débriefing.</p>
        <div class="choice"><span class="small muted">Équipe</span>${seg}</div>
        <p class="small" style="margin:0"><b>Organisation prévue (05-PR-05) :</b> ${org}</p>
        <label class="f">Nom de l’exercice ou de l’équipe (facultatif)<input id="eq-label" class="eq-input" maxlength="60" value="${esc(EQ.label)}" placeholder="ex. Équipe VSAV 1, cas n° 3"></label>
        <button class="btn primary eq-go" data-act="eq-start">Démarrer : arrivée auprès de la victime</button>
      </section>${hist}</div>`;
  }
  setTimeout(() => { eqTick(); eqLog(); }, 0);
  const B = (k, cls) => `<button class="eq-b ${cls || ""}" data-act="eq-ev" data-v="${k}">${esc(EQ_EV[k].short)}</button>`;
  return `<div class="wrap">${head}
    <div class="eq-live">
      <section class="eq-main">
        <div class="eq-top"><div><div class="small">Temps écoulé</div><div class="eq-time mono" id="eq-time">00:00</div></div>
          <div class="eq-kpi"><div><span class="small">Fraction de compressions</span><b class="eq-big mono" id="eq-ccf">—</b></div><div><span class="small">Depuis le dernier relais</span><b class="eq-big mono" id="eq-relay">—</b></div><div><span class="small" id="eq-ana-l">Avant la prochaine analyse</span><b class="eq-big mono" id="eq-ana">—</b></div></div></div>
        <button class="eq-comp" id="eq-comp" data-act="eq-ev" data-v="toggle"><b>Début des compressions</b><small>Toucher dès que les mains reprennent</small></button>
        <div class="eq-pause" id="eq-pause" hidden></div>
        <div class="eq-hint" id="eq-hint" hidden></div>
      </section>
      <section class="panel">
        <div class="eq-grid">
          ${B("relais", "c-relais")}${B("dae", "c-dae")}${B("analyse", "c-ana")}${B("choc", "c-choc")}${B("nochoc")}${B("alerte")}${B("o2")}${B("canule")}${B("asp")}
        </div>
        <div class="eq-grid2">${B("vie", "c-vie")}${B("fin", "c-fin")}</div>
        <div class="actions"><button class="btn ghost" data-act="eq-undo">Annuler le dernier appui</button><button class="btn ghost" data-act="eq-abort">Abandonner</button></div>
        <ol class="ch-log" id="eq-log"></ol>
      </section>
    </div>
    <p class="small muted" style="margin:0">Appuyer sur « Analyse » arrête aussi le compteur de compressions. Après un choc ou un choc non recommandé, appuyer sur le gros bouton dès la reprise.</p>
  </div>`;
}

/* ====== Mode exercice : un seul écran de téléphone, lisible de loin ====== */
const EXO = { guide: false, guideT: null, refresh: null, lastTotal: 0, done: null };
function exoGuide(on){
  clearTimeout(EXO.guideT);
  if (!on) return;
  const tick = () => { if (!RC.running || !EXO.guide) return; if (RC.phase === "comp") rcTick(false); EXO.guideT = setTimeout(tick, 60000 / RC.bpm); };
  tick();
}
async function exoStart(){
  RC.source = "capteur"; RC.stats = null; RC.total = 0; EXO.done = null; EXO.lastTotal = 0;
  if (!RC.measuring) await rcMeasureStart();
  if (RC.permission !== "ok") { exoPaint(); return; }
  rcStart(); exoGuide(EXO.guide);
  try { const de = document.documentElement; if (!document.fullscreenElement && de.requestFullscreen) await de.requestFullscreen(); } catch (e) {}
  exoPaint();
}
function exoStop(){
  const S = RC.stats;
  EXO.done = { t: RC.elapsed, n: RC.total || 0, cycles: RC.cycle, S: S ? { ...S } : null };
  rcStop(); exoGuide(false); exoPaint();
}
function exoCls(kind, v){
  if (v == null) return "";
  if (kind === "rate") return v < 100 ? "lent" : v > 120 ? "rapide" : "bon";
  return v < 4.5 ? "lent" : v < 5 ? "juste" : v <= 6 ? "bon" : "rapide";
}
function exoMsg(kind, v){
  if (v == null) return "";
  if (kind === "rate") return v < 100 ? "Plus vite" : v > 120 ? "Moins vite" : "Bon rythme";
  return v < 4.5 ? "Plus fort" : v < 5 ? "Un peu plus" : v <= 6 ? "Bonne profondeur" : "Moins fort";
}
function exoPaint(){
  const q = id => document.getElementById(id); if (!q("exo")) { clearInterval(EXO.refresh); return; }
  const n = RC_MODES[RC.mode].n, set = (id, v) => { const e = q(id); if (e && e.innerHTML !== v) e.innerHTML = v; };
  // compressions
  let big, sub, cls = "";
  if (RC.phase === "insuf") { big = `${RC.insuf}<small> / ${RC.insufTotal}</small>`; sub = "Insufflations"; cls = "insuf"; }
  else if (RC.phase === "vent") { big = String(RC.insuf); sub = "Insufflations"; cls = "insuf"; }
  else if (RC.running) { big = n ? `${RC.count}<small> / ${n}</small>` : String(RC.count); sub = n ? `Cycle ${RC.cycle}` : "Compressions en continu"; }
  else { big = n ? `0<small> / ${n}</small>` : "0"; sub = RC_MODES[RC.mode].label; }
  set("exo-count", big); set("exo-csub", sub);
  const cb = q("exo-cbox"); if (cb) cb.className = "exo-box exo-c " + cls;
  if ((RC.total || 0) !== EXO.lastTotal) { EXO.lastTotal = RC.total || 0; if (cb) { cb.classList.remove("hit"); void cb.offsetWidth; cb.classList.add("hit"); } }
  // rythme et profondeur
  const live = RC.measuring && RC.running;
  const r = live ? RC.rate : null, d = live ? RC.depth : null;
  set("exo-rate", r == null ? "—" : String(r)); set("exo-rmsg", r == null ? (RC.running ? "En attente…" : "") : exoMsg("rate", r));
  set("exo-depth", d == null ? "—" : d.toFixed(1).replace(".", ",")); set("exo-dmsg", d == null ? (RC.running ? "En attente…" : "") : exoMsg("depth", d));
  const rb = q("exo-rbox"); if (rb) rb.className = "exo-box " + exoCls("rate", r);
  const db = q("exo-dbox"); if (db) db.className = "exo-box " + exoCls("depth", d);
  const rn = q("exo-rneedle"); if (rn) { rn.style.left = (r == null ? 50 : Math.max(0, Math.min(100, (r - 70) / 80 * 100))) + "%"; rn.style.opacity = r == null ? .2 : 1; }
  const dn = q("exo-dneedle"); if (dn) { dn.style.left = (d == null ? 50 : Math.max(0, Math.min(100, (d - 2) / 6 * 100))) + "%"; dn.style.opacity = d == null ? .2 : 1; }
  set("exo-time", rcFmt(RC.running ? RC.elapsed : EXO.done ? EXO.done.t : 0));
  // bouton et panneaux
  const go = q("exo-go"); if (go) { go.textContent = RC.running ? "Arrêter" : "Démarrer"; go.className = "exo-go " + (RC.running ? "stop" : ""); }
  const st = q("exo-setup"); if (st) st.hidden = RC.running;
  const perm = q("exo-perm");
  if (perm) { perm.hidden = !(RC.permission === "refus" || RC.permission === "absent"); perm.textContent = RC.permission === "refus" ? "Le capteur de mouvement a été refusé : autorise-le dans les réglages du navigateur, puis recommence." : "Cet appareil ne fournit pas de capteur de mouvement. Le mode exercice fonctionne sur téléphone ou tablette."; }
  const res = q("exo-res");
  if (res) {
    const D = EXO.done; res.hidden = !D || RC.running;
    const gr = document.querySelector(".exo-grid"); if (gr) gr.hidden = !!D && !RC.running;
    if (D && !RC.running) { const S = D.S, pct = k => S && S.n ? Math.round(S[k] / S.n * 100) + " %" : "—";
      res.innerHTML = `<div class="exo-rh"><b>Bilan</b><span class="mono">${rcFmt(D.t)} · ${D.n} compressions</span></div>
        <div class="exo-rg"><div><b class="mono">${S && S.n ? (S.sumD / S.n).toFixed(1).replace(".", ",") + " cm" : "—"}</b><span>profondeur moyenne</span></div><div><b class="mono">${pct("depth")}</b><span>entre 5 et 6 cm</span></div><div><b class="mono">${pct("rate")}</b><span>entre 100 et 120/min</span></div><div><b class="mono">${pct("duty")}</b><span>compression = relâchement</span></div></div>`; }
  }
}
function exoClick(a, b){
  if (a === "exo-go") { RC.running ? exoStop() : exoStart(); return; }
  if (a === "exo-mode") { EXO.done = null; RC.mode = b.dataset.v; document.querySelectorAll('[data-act="exo-mode"]').forEach(x => x.setAttribute("aria-pressed", String(x === b))); exoPaint(); return; }
  if (a === "exo-guide") { EXO.guide = !EXO.guide; b.setAttribute("aria-pressed", String(EXO.guide)); b.textContent = EXO.guide ? "Bip-guide " + RC.bpm + "/min : oui" : "Bip-guide : non"; exoGuide(EXO.guide && RC.running); return; }
  if (a === "exo-sound") { RC.sound = !RC.sound; b.setAttribute("aria-pressed", String(RC.sound)); b.textContent = RC.sound ? "Son : oui" : "Son : non"; return; }
  if (a === "exo-quit") { if (RC.running) exoStop(); try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {} location.hash = "rcp"; return; }
}
function renderExo(){
  if (RC.mode === "ventil") RC.mode = "adulte";
  clearInterval(EXO.refresh); EXO.refresh = setInterval(exoPaint, 100); setTimeout(exoPaint, 0);
  const m = (v, l) => `<button data-act="exo-mode" data-v="${v}" aria-pressed="${RC.mode === v}">${l}</button>`;
  return `<div class="exo" id="exo">
    <div class="exo-top"><span class="mono" id="exo-time">00:00</span><span class="exo-k">${RC.K !== 1 ? "Étalonné" : "Non étalonné"}</span><button class="exo-x" data-act="exo-quit" aria-label="Quitter le mode exercice">✕</button></div>
    <div class="exo-flash" id="rc-flash" hidden></div>
    <div class="exo-grid">
      <div class="exo-box exo-c" id="exo-cbox"><span class="exo-l">Compressions</span><b class="exo-v mono" id="exo-count">0</b><span class="exo-m" id="exo-csub"></span></div>
      <div class="exo-box" id="exo-rbox"><span class="exo-l">Rythme <small>/min</small></span><b class="exo-v mono" id="exo-rate">—</b>
        <div class="exo-bar"><span class="z lent" style="flex:30"></span><span class="z bon" style="flex:20"></span><span class="z rapide" style="flex:30"></span><i id="exo-rneedle"></i></div><span class="exo-m" id="exo-rmsg"></span></div>
      <div class="exo-box" id="exo-dbox"><span class="exo-l">Enfoncement <small>cm</small></span><b class="exo-v mono" id="exo-depth">—</b>
        <div class="exo-bar"><span class="z lent" style="flex:3"></span><span class="z bon" style="flex:1"></span><span class="z rapide" style="flex:2"></span><i id="exo-dneedle"></i></div><span class="exo-m" id="exo-dmsg"></span></div>
    </div>
    <div class="exo-res" id="exo-res" hidden></div>
    <div class="exo-perm" id="exo-perm" hidden></div>
    <div class="exo-setup" id="exo-setup">
      <div class="seg exo-seg" role="group">${m("adulte", "Adulte 30/2")}${m("enfant", "Enfant 15/2")}${m("continu", "Continu")}</div>
      <div class="exo-opts"><button class="btn ghost" data-act="exo-guide" aria-pressed="${EXO.guide}">${EXO.guide ? "Bip-guide " + RC.bpm + "/min : oui" : "Bip-guide : non"}</button><button class="btn ghost" data-act="exo-sound" aria-pressed="${RC.sound}">${RC.sound ? "Son : oui" : "Son : non"}</button></div>
    </div>
    <button class="exo-go" id="exo-go" data-act="exo-go">Démarrer</button>
  </div>`;
}

render();

</script>
